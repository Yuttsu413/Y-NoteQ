<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Y-NoteQ - 単語暗記管理アプリ</title>
    
    <!-- Google Fonts & FontAwesome CDN -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- PDF生成用ライブラリ -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <style>
        @font-face {
            font-family: 'CenturyGothicBold';
            src: local('Century Gothic Bold'), local('CenturyGothic-Bold');
            font-weight: bold;
            font-display: swap;
        }

        :root {
            --primary-color: #F2CF00;
            --primary-hover: #d1b200;
            --primary-light: #fff8d6;
            
            --lvl-0: #888888;
            --lvl-0-text: #ffffff;
            --lvl-1: #2196F3;
            --lvl-2: #4CAF50;
            --lvl-3: #FFEB3B;
            --lvl-3-text: #333333;
            --lvl-4: #FF9800;
            --lvl-5: #F44336;
            --lvl-6: #9C27B0;

            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-color: #2c3e50;
            --border-color: #e2e8f0;
            --header-bg: #ffffff;
            --shadow-color: rgba(0, 0, 0, 0.08);
            --input-bg: #f8fafc;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Century Gothic', CenturyGothic, 'CenturyGothicBold', 'Noto Sans JP', sans-serif;
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background-color: var(--header-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 0.75rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 4px var(--shadow-color);
        }

        .header-logo {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            text-decoration: none;
            color: var(--text-color);
        }

        .header-logo svg, .header-logo img {
            width: 32px;
            height: 32px;
        }

        .header-title {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .header-nav {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .nav-btn {
            background: transparent;
            border: none;
            color: var(--text-color);
            font-size: 1.1rem;
            cursor: pointer;
            padding: 6px 10px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .nav-btn:hover {
            background-color: rgba(242, 207, 0, 0.2);
        }

        .volume-control {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .volume-control input[type="range"] {
            width: 70px;
            accent-color: var(--primary-color);
        }

        .account-dropdown {
            position: relative;
        }

        .avatar-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background-color: var(--primary-color);
            color: #121824;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            cursor: pointer;
            border: 2px solid var(--border-color);
        }

        .dropdown-menu {
            position: absolute;
            right: 0;
            top: 45px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            box-shadow: 0 4px 12px var(--shadow-color);
            display: none;
            flex-direction: column;
            width: 160px;
            overflow: hidden;
            z-index: 200;
        }

        .dropdown-menu.show {
            display: flex;
        }

        .dropdown-item {
            padding: 10px 15px;
            color: var(--text-color);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            font-size: 0.9rem;
            border: none;
            background: transparent;
            width: 100%;
            text-align: left;
        }

        .dropdown-item:hover {
            background-color: var(--primary-light);
            color: #121824;
        }

        .tabs-container {
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: center;
            gap: 10px;
            padding: 0 10px;
        }

        .tab-btn {
            padding: 12px 20px;
            background: transparent;
            border: none;
            border-bottom: 3px solid transparent;
            color: var(--text-color);
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.95rem;
        }

        .tab-btn.active {
            border-bottom-color: var(--primary-color);
            font-weight: bold;
            color: var(--primary-hover);
        }

        .deck-header-info {
            background: var(--primary-light);
            color: #333;
            padding: 8px 15px;
            text-align: center;
            font-weight: bold;
            display: none;
        }

        main {
            flex: 1;
            padding: 20px;
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
        }

        footer {
            background-color: var(--header-bg);
            border-top: 1px solid var(--border-color);
            padding: 15px;
            text-align: center;
            font-size: 0.85rem;
            color: #718096;
            margin-top: auto;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 4px 6px var(--shadow-color);
            margin-bottom: 20px;
        }

        .btn {
            padding: 8px 16px;
            border-radius: 8px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-size: 0.9rem;
        }

        .btn-primary {
            background-color: var(--primary-color);
            color: #121824;
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
        }

        .btn-secondary {
            background-color: var(--border-color);
            color: var(--text-color);
        }

        .btn-danger {
            background-color: #ef4444;
            color: white;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 500;
            font-size: 0.9rem;
        }

        .form-control {
            width: 100%;
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background-color: var(--input-bg);
            color: var(--text-color);
            font-size: 0.95rem;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #3b82f6 100%);
            padding: 20px;
            position: fixed;
            top:0; left:0; right:0; bottom:0;
            z-index: 1000;
        }

        .auth-card {
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            max-width: 420px;
            color: #ffffff;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        .auth-logo {
            text-align: center;
            margin-bottom: 24px;
        }

        .auth-logo h1 {
            font-size: 2.2rem;
            color: var(--primary-color);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .folder-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .folder-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            cursor: pointer;
            position: relative;
            box-shadow: 0 2px 5px var(--shadow-color);
            border-left: 6px solid var(--primary-color);
        }

        .folder-card:hover {
            transform: translateY(-2px);
        }

        .folder-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .folder-title {
            font-size: 1.2rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .deck-list {
            margin-top: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .deck-item {
            padding: 8px 12px;
            background-color: var(--input-bg);
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
        }

        .analytics-bar {
            height: 28px;
            border-radius: 14px;
            overflow: hidden;
            display: flex;
            width: 100%;
            background-color: var(--border-color);
            margin: 15px 0;
        }

        .analytics-segment {
            height: 100%;
            transition: width 0.3s ease;
        }

        .analytics-legend {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            font-size: 0.85rem;
            margin-bottom: 15px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .bg-lvl-0 { background-color: var(--lvl-0); color: var(--lvl-0-text); border: 1px solid var(--border-color); }
        .bg-lvl-1 { background-color: var(--lvl-1); color: white; }
        .bg-lvl-2 { background-color: var(--lvl-2); color: white; }
        .bg-lvl-3 { background-color: var(--lvl-3); color: var(--lvl-3-text); }
        .bg-lvl-4 { background-color: var(--lvl-4); color: white; }
        .bg-lvl-5 { background-color: var(--lvl-5); color: white; }
        .bg-lvl-6 { background-color: var(--lvl-6); color: white; }

        .filter-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 10px;
            margin-bottom: 15px;
        }

        .word-table-wrapper {
            overflow-x: auto;
        }

        .word-table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.9rem;
        }

        .word-table th, .word-table td {
            padding: 12px 10px;
            border-bottom: 1px solid var(--border-color);
        }

        .word-table th {
            background-color: var(--input-bg);
            font-weight: 600;
        }

        .lvl-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 0.8rem;
            text-align: center;
        }

        .lvl-btn-group {
            display: inline-flex;
            gap: 4px;
            align-items: center;
        }

        .lvl-select-btn {
            width: 26px;
            height: 26px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            font-size: 0.75rem;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0.6;
            transition: all 0.15s ease;
        }

        .lvl-select-btn:hover, .lvl-select-btn.active {
            opacity: 1;
            transform: scale(1.1);
            box-shadow: 0 2px 4px var(--shadow-color);
        }

        .chip-group {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 6px;
        }

        .chip-btn {
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            background: var(--input-bg);
            color: var(--text-color);
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .chip-btn input[type="checkbox"] {
            display: none;
        }

        .chip-btn.active {
            background-color: var(--primary-color);
            color: #121824;
            border-color: var(--primary-hover);
        }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal-content {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 24px;
            max-width: 500px;
            width: 90%;
            max-height: 85vh;
            overflow-y: auto;
            position: relative;
        }

        .close-modal {
            position: absolute;
            top: 15px;
            right: 15px;
            background: transparent;
            border: none;
            font-size: 1.2rem;
            color: var(--text-color);
            cursor: pointer;
        }

        @media (max-width: 768px) {
            .desktop-only { display: none !important; }
            .header-nav .nav-text { display: none; }
            .tabs-container {
                position: fixed;
                bottom: 0;
                left: 0;
                right: 0;
                z-index: 90;
                border-top: 1px solid var(--border-color);
                border-bottom: none;
                justify-content: space-around;
                padding: 6px 0;
            }
            .tab-btn {
                flex-direction: column;
                padding: 6px;
                font-size: 0.75rem;
                gap: 3px;
                border-bottom: none;
            }
            .tab-btn.active {
                border-bottom: none;
                color: var(--primary-hover);
            }
            body { padding-bottom: 60px; }
        }

        @media (min-width: 769px) {
            .mobile-only { display: none !important; }
        }
    </style>
</head>
<body class="light-mode">

    <!-- 認証画面 (ログイン/新規登録) -->
    <div id="authScreen" class="auth-container">
        <!-- ログインフォーム -->
        <div id="loginCard" class="auth-card">
            <div class="auth-logo">
                <h1>
                    <svg viewBox="0 0 100 100" width="38" height="38">
                        <path d="M50 8 C30 8 18 28 18 58 C18 78 32 92 50 92 C68 92 82 78 82 58 C82 28 70 8 50 8 Z" fill="#F2CF00"/>
                        <circle cx="38" cy="36" r="6" fill="#121824"/>
                        <circle cx="62" cy="36" r="6" fill="#121824"/>
                        <circle cx="40" cy="34" r="2" fill="#FFFFFF"/>
                        <circle cx="64" cy="34" r="2" fill="#FFFFFF"/>
                        <polygon points="50,42 40,52 60,52" fill="#FF9800"/>
                    </svg>
                    Y-NoteQ
                </h1>
                <p style="font-size: 0.85rem; color: #cbd5e1; margin-top: 5px;">単語暗記管理ノートシステム</p>
            </div>
            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label><i class="fa-solid fa-envelope"></i> メールアドレス</label>
                    <input type="email" id="loginEmail" class="form-control" placeholder="example@mail.com" required>
                </div>
                <div class="form-group">
                    <label><i class="fa-solid fa-lock"></i> パスワード</label>
                    <input type="password" id="loginPassword" class="form-control" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px; padding: 12px;">
                    <i class="fa-solid fa-right-to-bracket"></i> ログイン
                </button>
            </form>
            <div style="margin-top: 20px; text-align: center;">
                <button class="btn btn-secondary" onclick="switchAuthView('invite')" style="width: 100%;">
                    新規登録はこちら
                </button>
            </div>
        </div>

        <!-- 新規登録フォーム -->
        <div id="signupCard" class="auth-card" style="display: none;">
            <div class="auth-logo">
                <h1>Y-NoteQ</h1>
                <p id="signupStepTitle" style="font-size: 0.9rem; color: #cbd5e1;">新規アカウント作成 (1/2)</p>
            </div>

            <!-- ステップ1: 招待コード認証 -->
            <div id="inviteStep">
                <div class="form-group">
                    <label><i class="fa-solid fa-key"></i> 招待コードを入力</label>
                    <input type="text" id="inviteCodeInput" class="form-control" placeholder="例: 123456" style="text-transform: uppercase;">
                    <small style="color: #cbd5e1; font-size:0.75rem; display:block; margin-top:4px;">※ 有効な招待コードをお持ちの方のみ登録できます。</small>
                </div>
                <button type="button" class="btn btn-primary" onclick="verifyInviteCode()" style="width: 100%;">照合して次へ</button>
            </div>

            <!-- ステップ2: アカウント情報入力 -->
            <form id="signupForm" style="display: none;" onsubmit="handleSignup(event)">
                <div class="form-group">
                    <label><i class="fa-solid fa-envelope"></i> メールアドレス</label>
                    <input type="email" id="signupEmail" class="form-control" placeholder="example@mail.com" required>
                </div>
                <div class="form-group">
                    <label><i class="fa-solid fa-lock"></i> パスワード (8文字以上)</label>
                    <input type="password" id="signupPassword" class="form-control" minlength="8" placeholder="8文字以上" required>
                </div>
                <div class="form-group">
                    <label><i class="fa-solid fa-check-double"></i> パスワード (確認)</label>
                    <input type="password" id="signupPasswordConfirm" class="form-control" minlength="8" placeholder="もう一度入力" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">アカウント登録</button>
            </form>

            <div style="margin-top: 15px; text-align: center;">
                <button class="btn btn-secondary" onclick="switchAuthView('login')" style="background: transparent; color: #cbd5e1;">
                    <i class="fa-solid fa-arrow-left"></i> ログイン画面に戻る
                </button>
            </div>
        </div>
    </div>

    <!-- アプリ本体 ヘッダー -->
    <header>
        <a class="header-logo" onclick="switchTab('folder')">
            <svg id="headerLogoSvg" viewBox="0 0 100 100" width="32" height="32">
                <path d="M50 8 C30 8 18 28 18 58 C18 78 32 92 50 92 C68 92 82 78 82 58 C82 28 70 8 50 8 Z" fill="#F2CF00"/>
                <circle cx="38" cy="36" r="6" fill="#121824"/>
                <circle cx="62" cy="36" r="6" fill="#121824"/>
                <circle cx="40" cy="34" r="2" fill="#FFFFFF"/>
                <circle cx="64" cy="34" r="2" fill="#FFFFFF"/>
                <polygon points="50,42 40,52 60,52" fill="#FF9800"/>
            </svg>
            <span class="header-title">Y-NoteQ</span>
        </a>

        <div class="header-nav">
            <button class="nav-btn" onclick="openModal('patchModal')">
                <i class="fa-solid fa-code-branch"></i> <span class="nav-text">パッチノート</span>
            </button>

            <div class="account-dropdown desktop-only">
                <div class="avatar-btn" id="userAvatarBtn" onclick="toggleDropdown('accountMenu')">Y</div>
                <div class="dropdown-menu" id="accountMenu">
                    <button class="dropdown-item" onclick="switchTab('account')"><i class="fa-solid fa-user"></i> プロフィール</button>
                    <button class="dropdown-item" onclick="openModal('bugReportModal')"><i class="fa-solid fa-bug"></i> バグを報告</button>
                    <button class="dropdown-item" onclick="handleLogout()"><i class="fa-solid fa-right-from-bracket"></i> ログアウト</button>
                </div>
            </div>
        </div>
    </header>

    <div id="deckHeaderInfo" class="deck-header-info">
        選択中の単語帳: <span id="currentDeckNameDisplay">未選択</span>
    </div>

    <!-- タブナビゲーション -->
    <nav class="tabs-container">
        <button class="tab-btn active" onclick="switchTab('folder')"><i class="fa-solid fa-folder"></i> フォルダー</button>
        <button class="tab-btn" onclick="switchTab('words')"><i class="fa-solid fa-list-check"></i> 単語一覧</button>
        <button class="tab-btn" onclick="switchTab('test')"><i class="fa-solid fa-graduation-cap"></i> テスト</button>
        <button class="tab-btn" onclick="switchTab('edit')"><i class="fa-solid fa-pen-to-square"></i> 編集</button>
        <button class="tab-btn mobile-only" onclick="switchTab('account')"><i class="fa-solid fa-user"></i> アカウント</button>
    </nav>

    <!-- メインコンテンツ -->
    <main>
        <!-- フォルダー タブ -->
        <section id="tab-folder" class="tab-content">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h2><i class="fa-solid fa-folder-open"></i> フォルダー一覧</h2>
                <button class="btn btn-primary" onclick="openModal('addFolderModal')">
                    <i class="fa-solid fa-plus"></i> 新規フォルダー作成
                </button>
            </div>
            
            <div id="folderContainer" class="folder-grid"></div>
        </section>

        <!-- 単語一覧 タブ -->
        <section id="tab-words" class="tab-content" style="display: none;">
            <div class="card">
                <h3><i class="fa-solid fa-table"></i> 単語リスト</h3>
                <div class="word-table-wrapper" id="pdfTableTarget">
                    <table class="word-table">
                        <thead>
                            <tr>
                                <th>単語No.</th>
                                <th>単語</th>
                                <th>意味</th>
                                <th>実施日</th>
                                <th>暗記度</th>
                            </tr>
                        </thead>
                        <tbody id="wordTableBody"></tbody>
                    </table>
                </div>
            </div>
        </section>

        <!-- テスト タブ -->
        <section id="tab-test" class="tab-content" style="display: none;">
            <div class="card">
                <h3>小テスト</h3>
                <p style="margin-top: 10px;">単語テスト機能</p>
            </div>
        </section>

        <!-- 編集 タブ -->
        <section id="tab-edit" class="tab-content" style="display: none;">

        <!-- アカウント タブ -->
        <section id="tab-account" class="tab-content" style="display: none;">
            <div class="card" style="max-width: 650px; margin: 0 auto;">
                <div style="text-align: center; margin-bottom: 20px;">
                    <div class="avatar-btn" style="width: 80px; height: 80px; font-size: 2rem; margin: 0 auto 10px;">Y</div>
                    <h2 id="profileUsername">ユーザーネーム</h2>
                    <p id="profileEmail" style="color: #718096;">user@example.com</p>

    <!-- モーダルダイアログ群 -->

    <!-- Firebase SDK (10.x SDK CDN) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <script>
        // 1. Firebaseの設定
        const firebaseConfig = {
            apiKey: "AIzaSyC4X91yGIZkHxj3xPOAnc_R5uuCVw0iwtI",
            authDomain: "y-noteq-a.firebaseapp.com",
            databaseURL: "https://y-noteq-a-default-rtdb.firebaseio.com",
            projectId: "y-noteq-a",
            storageBucket: "y-noteq-a.firebasestorage.app",
            messagingSenderId: "500955780666",
            appId: "1:500955780666:web:88ba469096c53525590703",
            measurementId: "G-SWPW6NYML4"
        };

        // 2. Firebase初期化
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const auth = firebase.auth();
        const db = firebase.firestore();

        // アプリデータ定義
        const VALID_INVITE_CODES = ['123456', 'YNOTEQ', 'YNOTE2026', 'YNOTE-GIFT'];
        let folders = [];
        let currentDeckId = null;

        // 3. 認証ビュー切替
        function switchAuthView(view) {
            const loginCard = document.getElementById('loginCard');
            const signupCard = document.getElementById('signupCard');
            if (view === 'login') {
                loginCard.style.display = 'block';
                signupCard.style.display = 'none';
            } else {
                loginCard.style.display = 'none';
                signupCard.style.display = 'block';
                document.getElementById('inviteStep').style.display = 'block';
                document.getElementById('signupForm').style.display = 'none';
                document.getElementById('signupStepTitle').innerText = '新規アカウント作成 (1/2)';
            }
        }

        // 招待コード確認
        function verifyInviteCode() {
            const codeInput = document.getElementById('inviteCodeInput').value.trim().toUpperCase();
            if (VALID_INVITE_CODES.includes(codeInput)) {
                document.getElementById('inviteStep').style.display = 'none';
                document.getElementById('signupForm').style.display = 'block';
                document.getElementById('signupStepTitle').innerText = 'アカウント情報入力 (2/2)';
            } else {
                alert('無効な招待コードです。');
            }
        }

        // 4. ログイン処理
        function handleLogin(event) {
            event.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;

            auth.signInWithEmailAndPassword(email, password)
                .then((userCredential) => {
                    alert('ログインしました');
                    document.getElementById('authScreen').style.display = 'none';
                })
                .catch((error) => {
                    console.error("ログインエラー:", error);
                    alert('ログインエラー: ' + error.message);
                });
        }

        // 5. 新規登録処理
        function handleSignup(event) {
            event.preventDefault();
            const email = document.getElementById('signupEmail').value;
            const password = document.getElementById('signupPassword').value;
            const passwordConfirm = document.getElementById('signupPasswordConfirm').value;

            if (password !== passwordConfirm) {
                alert('パスワードが一致しません');
                return;
            }

            auth.createUserWithEmailAndPassword(email, password)
                .then((userCredential) => {
                    alert('アカウント登録が完了しました');
                    document.getElementById('authScreen').style.display = 'none';
                })
                .catch((error) => {
                    console.error("登録エラー:", error);
                    alert('登録エラー: ' + error.message);
                });
        }

        // 6. ログアウト処理
        function handleLogout() {
            auth.signOut().then(() => {
                alert('ログアウトしました');
                document.getElementById('authScreen').style.display = 'flex';
            }).catch((error) => {
                console.error("ログアウトエラー:", error);
            });
        }

        // 7. 認証状態のリアルタイム監視
        auth.onAuthStateChanged((user) => {
            if (user) {
                document.getElementById('authScreen').style.display = 'none';
                document.getElementById('profileEmail').innerText = user.email || 'user@example.com';
                document.getElementById('profileUsername').innerText = user.email ? user.email.split('@')[0] : 'ユーザー';
            } else {
                document.getElementById('authScreen').style.display = 'flex';
            }
        });

        // 画面モーダル操作関数
        function openModal(id) { document.getElementById(id).style.display = 'flex'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }
        function toggleDropdown(id) {
            const menu = document.getElementById(id);
            menu.classList.toggle('show');
        }

        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(el => el.style.display = 'none');
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));

            const targetTab = document.getElementById(`tab-${tabName}`);
            if (targetTab) targetTab.style.display = 'block';

            const activeBtn = Array.from(document.querySelectorAll('.tab-btn')).find(b => b.getAttribute('onclick').includes(tabName));
            if (activeBtn) activeBtn.classList.add('active');
        }
    </script>
</body>
</html>
